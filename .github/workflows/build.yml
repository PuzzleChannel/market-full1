name: Build AVECOINS VMcoin

on:
  push:
    branches:
      - main
      - restore-vmcoin
    paths:
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Fabric metadata
        run: python3 -m json.tool src/main/resources/fabric.mod.json > /dev/null

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: avecoins-vmutcoin-fabric-26.2
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
