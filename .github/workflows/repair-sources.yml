name: Repair reconstructed Java sources

on:
  push:
    branches:
      - restore-vmcoin
    paths:
      - "scripts/repair_cfr.py"
      - "repair-source-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovered project
        uses: actions/checkout@v4
        with:
          ref: restore-vmcoin
          fetch-depth: 0

      - name: Repair CFR generic casts
        run: python3 scripts/repair_cfr.py

      - name: Commit source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          if git diff --cached --quiet; then
            echo "No source repairs were needed."
            exit 0
          fi
          git commit -m "Repair reconstructed Java generics and widgets"
          git push origin HEAD:restore-vmcoin
